<body class="min-h-screen antialiased selection:bg-slate-800 selection:text-white pb-16">

  <!-- 頂部控制列 -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-5xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap sm:flex-nowrap items-center justify-center gap-2 sm:gap-3">
      
      <!-- 位置／分類／狀態三組（永遠同一行並隨螢幕寬彈性縮放） -->
      <div class="flex flex-nowrap items-stretch gap-1.5 sm:gap-2.5 w-full sm:flex-1 min-w-0">
        <!-- 位置組 -->
        <div class="relative flex-1 min-w-0 inline-flex items-stretch rounded-lg shadow-2xs" data-filter-dropdown="location">
          <button type="button" onclick="UIController.setGroupBy('location')" id="groupByLocationBtn"
            class="shrink-0 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-800 bg-slate-800 text-white transition-colors cursor-pointer select-none whitespace-nowrap">
            依位置
          </button>
          <button type="button" id="filterBtn_location" onclick="UIController.toggleFilterDropdown('location', event)" aria-haspopup="true" aria-expanded="false"
            class="flex-1 min-w-0 inline-flex items-center justify-between gap-1 px-2 sm:px-2.5 py-1.5 bg-slate-100/90 hover:bg-slate-200/70 text-xs sm:text-sm font-medium text-slate-700 rounded-r-lg border border-slate-300/90 focus:outline-none focus:border-slate-500 transition-colors cursor-pointer select-none">
            <span id="filterLabel_location" class="truncate">全部</span>
            <span class="material-icons text-slate-400 shrink-0 transition-transform duration-150" id="filterArrow_location" style="font-size: 16px;">expand_more</span>
          </button>
          <div id="filterMenu_location" class="hidden absolute top-full left-0 mt-1.5 min-w-full w-48 sm:w-56 bg-white rounded-xl shadow-lg border border-slate-200/90 z-30 overflow-hidden"></div>
        </div>

        <!-- 分類組 -->
        <div class="relative flex-1 min-w-0 inline-flex items-stretch rounded-lg shadow-2xs" data-filter-dropdown="category">
          <button type="button" onclick="UIController.setGroupBy('category')" id="groupByCategoryBtn"
            class="shrink-0 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-300/90 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors cursor-pointer select-none whitespace-nowrap">
            依分類
          </button>
          <button type="button" id="filterBtn_category" onclick="UIController.toggleFilterDropdown('category', event)" aria-haspopup="true" aria-expanded="false"
            class="flex-1 min-w-0 inline-flex items-center justify-between gap-1 px-2 sm:px-2.5 py-1.5 bg-slate-100/90 hover:bg-slate-200/70 text-xs sm:text-sm font-medium text-slate-700 rounded-r-lg border border-slate-300/90 focus:outline-none focus:border-slate-500 transition-colors cursor-pointer select-none">
            <span id="filterLabel_category" class="truncate">全部</span>
            <span class="material-icons text-slate-400 shrink-0 transition-transform duration-150" id="filterArrow_category" style="font-size: 16px;">expand_more</span>
          </button>
          <div id="filterMenu_category" class="hidden absolute top-full left-0 mt-1.5 min-w-full w-44 sm:w-52 bg-white rounded-xl shadow-lg border border-slate-200/90 z-30 overflow-hidden"></div>
        </div>

        <!-- 狀態組 -->
        <div class="relative flex-1 min-w-0 inline-flex items-stretch rounded-lg shadow-2xs" data-filter-dropdown="status">
          <button type="button" onclick="UIController.setGroupBy('status')" id="groupByStatusBtn"
            class="shrink-0 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-300/90 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors cursor-pointer select-none whitespace-nowrap">
            依狀態
          </button>
          <button type="button" id="filterBtn_status" onclick="UIController.toggleFilterDropdown('status', event)" aria-haspopup="true" aria-expanded="false"
            class="flex-1 min-w-0 inline-flex items-center justify-between gap-1 px-2 sm:px-2.5 py-1.5 bg-slate-100/90 hover:bg-slate-200/70 text-xs sm:text-sm font-medium text-slate-700 rounded-r-lg border border-slate-300/90 focus:outline-none focus:border-slate-500 transition-colors cursor-pointer select-none">
            <span id="filterLabel_status" class="truncate">全部</span>
            <span class="material-icons text-slate-400 shrink-0 transition-transform duration-150" id="filterArrow_status" style="font-size: 16px;">expand_more</span>
          </button>
          <div id="filterMenu_status" class="hidden absolute top-full left-0 mt-1.5 min-w-full w-44 sm:w-52 bg-white rounded-xl shadow-lg border border-slate-200/90 z-30 overflow-hidden"></div>
        </div>
      </div>

        <span id="syncDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>

      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 pt-5">

    <!-- 錯誤提示列 -->

      <div class="flex items-start gap-2">
        <span class="material-icons text-rose-500 shrink-0 mt-0.5" style="font-size: 18px;">error_outline</span>
        <div>
          <p class="font-semibold">無法讀取試算表（目前顯示內建範例資料）</p>
          <p id="syncErrorDetail" class="text-rose-700/90 mt-0.5 text-xs whitespace-pre-line"></p>
        </div>
      </div>
      <button type="button" onclick="DataService.hideErrorBanner()"
        class="px-2 py-1 rounded-lg text-rose-500 hover:bg-rose-100 text-xs cursor-pointer shrink-0 self-end sm:self-center">
        關閉
      </button>
    </div>
    
    <div id="hierarchyContainer" class="space-y-4"></div>

    <div id="emptyState" class="hidden py-16 text-center bg-white rounded-2xl border border-slate-200/80">
      <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-2.5">
        <span class="material-icons">filter_alt_off</span>
      </div>
      <p class="text-sm font-medium text-slate-700">找不到符合篩選條件的設備</p>
      <button type="button" onclick="UIController.resetFilters()" class="mt-3 px-3.5 py-1.5 text-xs font-medium bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-colors cursor-pointer">
        重設篩選
      </button>
    </div>
  </main>

  <!-- 詳情面板 -->
  <div id="detailModal" onclick="UIController.closeDetailModal()" class="hidden fixed inset-0 z-40 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity">
    <div onclick="event.stopPropagation()" class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/70">
        <div class="flex items-center gap-3 min-w-0">
          <div id="modalIconBox" class="w-10 h-10 rounded-xl bg-white border border-slate-200/80 text-slate-700 flex items-center justify-center shrink-0 shadow-2xs"></div>
          <div class="min-w-0">
            <h2 id="modalAlias" class="text-base font-semibold text-slate-900 truncate">設備代稱</h2>
            <p id="modalItemName" class="text-xs text-slate-500 truncate">正式品項</p>
          </div>
        </div>
        <button type="button" onclick="UIController.closeDetailModal()" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 flex items-center justify-center transition-colors cursor-pointer">
          <span class="material-icons" style="font-size: 18px;">close</span>
        </button>
      </div>
      <div id="modalBody" class="p-5 space-y-3.5 text-xs sm:text-sm"></div>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * Config
     * ============================================================================
     */
    const Config = {
      // 試算表 ID（網址：https://docs.google.com/spreadsheets/d/【這串就是ID】/edit）
      SHEET_ID: '1UGZQa5FQY-3CaTtC7-8LfJz70sDX1UbkbVDAGciEZjQ',

      // 可選：指定分頁（兩者皆留空時讀取第一個分頁）
      SHEET_GID: '',       // 例如 '0'
      SHEET_NAME: '',      // 例如 '工作表1'

      // 單一連線通道逾時時間（毫秒）
      TIMEOUT_MS: 10000,

      STATUS_STYLES: {
        '正常': {
          cardClass: 'bg-white border-slate-200/90 hover:border-slate-400 hover:shadow-xs',
          optionSelectedClass: 'bg-slate-800 text-white hover:bg-slate-700',
          iconClass: 'text-slate-600 group-hover:text-slate-900',
          textClass: 'text-slate-800',
          badge: 'bg-slate-100 text-slate-700 border-slate-200',
          dot: '',
          showDot: false
        },
        '損壞': {
          cardClass: 'bg-rose-600 border-rose-700 hover:bg-rose-700 shadow-2xs',
          optionSelectedClass: 'bg-rose-600 text-white hover:bg-rose-700',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-rose-50 text-rose-700 border-rose-200',
          dot: 'bg-rose-500',
          showDot: true
        },
        '儲備': {
          cardClass: 'bg-sky-600 border-sky-700 hover:bg-sky-700 shadow-2xs',
          optionSelectedClass: 'bg-sky-600 text-white hover:bg-sky-700',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-sky-50 text-sky-700 border-sky-200',
          dot: 'bg-sky-500',
          showDot: true
        },
        '暫代': {
          cardClass: 'bg-amber-500 border-amber-600 hover:bg-amber-600 shadow-2xs',
          optionSelectedClass: 'bg-amber-500 text-white hover:bg-amber-600',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-amber-50 text-amber-700 border-amber-200',
          dot: 'bg-amber-500',
          showDot: true
        },
        '外借': {
          cardClass: 'bg-teal-600 border-teal-700 hover:bg-teal-700 shadow-2xs',
          optionSelectedClass: 'bg-teal-600 text-white hover:bg-teal-700',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-teal-50 text-teal-700 border-teal-200',
          dot: 'bg-teal-500',
          showDot: true
        },
        '送修': {
          cardClass: 'bg-orange-500 border-orange-600 hover:bg-orange-600 shadow-2xs',
          optionSelectedClass: 'bg-orange-500 text-white hover:bg-orange-600',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-orange-50 text-orange-700 border-orange-200',
          dot: 'bg-orange-500',
          showDot: true
        }
      },

      FALLBACK_ITEMS: [
        { rowNumber: 2, item: '投影機', category: '媒體', location: '四樓 歡喜地', status: '正常', note: '', alias: '投影機', iconHtml: '<span class="material-icons">videocam</span>', model: '', manualUrl: '', extraInfo: '' },
        { rowNumber: 3, item: '音響擴大器', category: '固定設備', location: '三樓 音控室', status: '正常', note: '', alias: '音響', iconHtml: '<span class="material-icons">speaker</span>', model: 'YAMAHA MA2120', manualUrl: 'https://tw.yamaha.com/zh/download/files/2097944/', extraInfo: '' },
        { rowNumber: 4, item: '麥克風接收天線', category: '固定設備', location: '四樓 歡喜地', status: '正常', note: '', alias: '接收器', iconHtml: '<span class="material-icons">settings_input_antenna</span>', model: 'MIPRO ACT 323', manualUrl: 'https://www.youtube.com/watch?v=7bTNLrbrvAE', extraInfo: '' },
        { rowNumber: 6, item: '無線麥克風', category: '音控', location: '一樓 齋堂', status: '正常', note: '#2', alias: '無線2 (5D)', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 33H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' },
        { rowNumber: 19, item: '無線麥克風', category: '音控', location: '三樓 音控室', status: '損壞', note: '#2-舊', alias: '無線2 (6C)', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 33H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' },
        { rowNumber: 20, item: '無線麥克風', category: '音控', location: '三樓 音控室', status: '儲備', note: '2025購入', alias: '無線麥', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 32H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' }
      ]
    };

    /**
     * ============================================================================
     * AppState
     * ============================================================================
     */
    const AppState = {
      items: [],
      meta: {
        isLive: false,
        transport: '',
        lastSyncedAt: null
      },
      dict: {
        categories: ['音控', '媒體', '攝錄', '固定設備'],
        locations: ['四樓 歡喜地', '三樓 大殿', '三樓 音控室', '二樓 大教室', '二樓 小教室', '二樓 辦公室', '一樓 齋堂'],
        statuses: ['正常', '儲備', '暫代', '外借', '送修', '損壞']
      },
      ui: {
        // null 代表全部顯示；Set<string> 代表明確勾選顯示的條件
        locationFilter: null,
        categoryFilter: null,
        statusFilter: null,
        openDropdown: null,
        groupBy: 'location',
        collapsedGroups: new Set()
      }
    };

    /**
     * ============================================================================
     * DataService（純前端無 CORS 讀取 Google Sheets：JSONP 主通道 + 兩層備援）
     * ============================================================================
     */
    const DataService = {
      isSyncing: false,

      normalizeText(val) {
        return String(val || '').replace(/\s+/g, ' ').trim();
      },

      setSyncStatus(state, message) {
        const dot = document.getElementById('syncDot');
        const label = document.getElementById('syncLabel');
        if (!dot || !label) return;

        if (state === 'loading') {
          dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
          label.textContent = message || '同步中';
        } else if (state === 'live') {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
          label.textContent = message || '已連線';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-rose-500';
          label.textContent = message || '連線異常';
        }
      },

      showErrorBanner(detailText) {
        const banner = document.getElementById('syncErrorBanner');
        const detail = document.getElementById('syncErrorDetail');
        if (!banner || !detail) return;
        detail.textContent = detailText;
        banner.classList.remove('hidden');
      },

      hideErrorBanner() {
        const banner = document.getElementById('syncErrorBanner');
        if (banner) banner.classList.add('hidden');
      },

      // 建立 gviz 查詢網址（可選傳入 JSONP callback 名稱）
      buildGvizUrl(callbackName = '') {
        const tqx = callbackName
          ? `out:json;responseHandler:${callbackName}`
          : 'out:json';
        let url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(Config.SHEET_ID)}/gviz/tq?tqx=${encodeURIComponent(tqx)}&headers=1`;
        if (Config.SHEET_GID) url += `&gid=${encodeURIComponent(Config.SHEET_GID)}`;
        if (Config.SHEET_NAME) url += `&sheet=${encodeURIComponent(Config.SHEET_NAME)}`;
        url += `&_t=${Date.now()}`;
        return url;
      },

      // 建立 CSV 匯出網址（第三層備援）
      buildCsvUrl() {
        let url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(Config.SHEET_ID)}/export?format=csv`;
        if (Config.SHEET_GID) url += `&gid=${encodeURIComponent(Config.SHEET_GID)}`;
        url += `&_t=${Date.now()}`;
        return url;
      },

      // 依品項名稱推斷預設圖標
      getDefaultIcon(itemName) {
        const name = String(itemName || '').toLowerCase();
        if (name.includes('投影') || name.includes('projector')) return '<span class="material-icons">videocam</span>';
        if (name.includes('音響') || name.includes('擴大') || name.includes('speaker')) return '<span class="material-icons">speaker</span>';
        if (name.includes('麥克風') || name.includes('mic')) return '<span class="material-icons">mic</span>';
        if (name.includes('天線') || name.includes('接收')) return '<span class="material-icons">settings_input_antenna</span>';
        if (name.includes('相機') || name.includes('攝影')) return '<span class="material-icons">photo_camera</span>';
        return '<span class="material-icons">devices</span>';
      },

      // 將二維表格（標題列 + 資料列）轉為標準設備物件陣列
      rowsToItems(headers, dataRows, rowNumberOffset = 2) {
        const cleanHeaders = headers.map(h => this.normalizeText(h));

        const findCol = (...names) => {
          // 1. 優先精準比對
          for (const n of names) {
            const idx = cleanHeaders.findIndex(c => c.toLowerCase() === n.toLowerCase());
            if (idx !== -1) return idx;
          }
          // 2. 次之模糊包含比對
          for (const n of names) {
            const idx = cleanHeaders.findIndex(c => c.toLowerCase().includes(n.toLowerCase()));
            if (idx !== -1) return idx;
          }
          return -1;
        };

        const colMap = {
          item:      findCol('品項', 'item', '設備', '名稱', '品名'),
          category:  findCol('分類', 'category', '類別'),
          location:  findCol('位置', 'location', '存放位置', '地點'),
          status:    findCol('狀態', 'status'),
          note:      findCol('備註', 'note', '說明'),
          alias:     findCol('代稱', 'alias', '簡稱', '顯示名稱'),
          model:     findCol('型號', 'model', '廠牌型號', '機型'),
          manualUrl: findCol('說明書', 'manual', 'manualurl', '連結', '影片', '操作說明'),
          extraInfo: findCol('相關資料', 'extrainfo', 'extra', '補充'),
          icon:      findCol('圖標', 'icon', 'iconhtml', '圖示')
        };

        if (colMap.item === -1) {
          throw new Error('找不到「品項」欄位，請確認試算表第一列標題是否正確');
        }

        const items = [];
        dataRows.forEach((row, idx) => {
          if (!Array.isArray(row)) return;
          const get = (key) => {
            const i = colMap[key];
            if (i === -1 || i >= row.length) return '';
            return String(row[i] ?? '').trim();
          };

          const itemName = get('item');
          if (!itemName) return;

          let iconHtml = get('icon');
          if (!iconHtml || !iconHtml.includes('material-icons')) {
            iconHtml = this.getDefaultIcon(itemName);
          }

          items.push({
            rowNumber: idx + rowNumberOffset,
            item: itemName,
            category: this.normalizeText(get('category')) || '其他',
            location: this.normalizeText(get('location')) || '未指定位置',
            status: this.normalizeText(get('status')) || '正常',
            note: get('note'),
            alias: get('alias') || itemName,
            model: get('model'),
            manualUrl: get('manualUrl'),
            extraInfo: get('extraInfo'),
            iconHtml
          });
        });

        return items;
      },

      // 解析 gviz JSON 物件（相容日期/格式化欄位與無標題自動辨識）
      parseGvizPayload(json) {
        if (!json) throw new Error('試算表回傳空資料');
        if (json.status === 'error') {
          const msg = (json.errors && json.errors[0] && (json.errors[0].detailed_message || json.errors[0].message)) || 'Google Sheets 回傳錯誤';
          throw new Error(msg);
        }
        if (!json.table || !Array.isArray(json.table.cols) || !Array.isArray(json.table.rows)) {
          throw new Error('試算表沒有資料或格式不正確');
        }

        const extractCell = (cell) => {
          if (!cell) return '';
          if (cell.f !== undefined && cell.f !== null && String(cell.f).trim() !== '') {
            return String(cell.f).trim();
          }
          if (cell.v !== undefined && cell.v !== null) {
            return String(cell.v).trim();
          }
          return '';
        };

        let headers = json.table.cols.map(c => (c.label || '').trim());
        let rows = json.table.rows.map(r => (r && Array.isArray(r.c)) ? r.c.map(extractCell) : []);
        let rowOffset = 2;

        // 若 Google 未自動辨識標題列（label 皆為空），則改取第一列作為標題
        if (headers.every(h => !h) && rows.length > 0) {
          headers = rows[0];
          rows = rows.slice(1);
          rowOffset = 2;
        }

        return this.rowsToItems(headers, rows, rowOffset);
      },

      // 內建 RFC 4180 CSV 解析器（供第三層備援使用）
      parseCsvText(csvText) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < csvText.length; i++) {
          const ch = csvText[i];
          const next = csvText[i + 1];

          if (inQuotes) {
            if (ch === '"' && next === '"') {
              field += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ',') {
              row.push(field);
              field = '';
            } else if (ch === '\r' && next === '\n') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
              i++;
            } else if (ch === '\n' || ch === '\r') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += ch;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }

        if (rows.length < 2) throw new Error('CSV 內容為空或缺少資料列');
        return this.rowsToItems(rows[0], rows.slice(1), 2);
      },

      // 通道 1（主通道）：JSONP 直連，完全不受瀏覽器 CORS Policy 限制
      fetchViaJsonp() {
        return new Promise((resolve, reject) => {
          const cbName = `__gviz_cb_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            if (timer) clearTimeout(timer);
            try { delete window[cbName]; } catch (_) { window[cbName] = undefined; }
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          const timer = setTimeout(() => {
            if (settled) return;
            settled = true;
            cleanup();
            reject(new Error('JSONP 連線逾時（請檢查網路或試算表權限）'));
          }, Config.TIMEOUT_MS);

          window[cbName] = (payload) => {
            if (settled) return;
            settled = true;
            cleanup();
            try {
              resolve(this.parseGvizPayload(payload));
            } catch (err) {
              reject(err);
            }
          };

          script.onerror = () => {
            if (settled) return;
            settled = true;
            cleanup();
            reject(new Error('JSONP 載入失敗（可能是試算表未開啟公開檢視權限）'));
          };

          script.async = true;
          script.src = this.buildGvizUrl(cbName);
          document.head.appendChild(script);
        });
      },

      // 通道 2（備援）：Fetch gviz JSON
      async fetchViaGvizFetch() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);
        try {
          const res = await fetch(this.buildGvizUrl(), {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            signal: controller.signal
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if (text.includes('Sign in') || text.includes('accounts.google.com')) {
            throw new Error('試算表權限不足，請設為「知道連結的任何人 → 檢視者」');
          }
          const start = text.indexOf('{');
          const end = text.lastIndexOf('}') + 1;
          if (start === -1 || end === 0) throw new Error('gviz 回傳格式異常');
          return this.parseGvizPayload(JSON.parse(text.slice(start, end)));
        } finally {
          clearTimeout(timer);
        }
      },

      // 通道 3（備援）：Fetch CSV 匯出
      async fetchViaCsvFetch() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);
        try {
          const res = await fetch(this.buildCsvUrl(), {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            signal: controller.signal
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = await res.text();
          if (text.includes('Sign in') || text.includes('accounts.google.com') || text.trim().startsWith('<!DOCTYPE html')) {
            throw new Error('試算表權限不足，請設為「知道連結的任何人 → 檢視者」');
          }
          return this.parseCsvText(text);
        } finally {
          clearTimeout(timer);
        }
      },

      // 依序嘗試三層通道讀取試算表
      async fetchFromSheet() {
        if (!Config.SHEET_ID || Config.SHEET_ID.includes('請在這裡')) {
          throw new Error('尚未設定試算表 ID（請在 Config.SHEET_ID 填入）');
        }

        const strategies = [
          { name: 'JSONP 直連', fn: () => this.fetchViaJsonp() },
          { name: 'Fetch gviz', fn: () => this.fetchViaGvizFetch() },
          { name: 'Fetch CSV', fn: () => this.fetchViaCsvFetch() }
        ];

        const errors = [];
        for (const strategy of strategies) {
          try {
            const items = await strategy.fn();
            return { items, transport: strategy.name };
          } catch (err) {
            errors.push(`${strategy.name}: ${err.message}`);
          }
        }

        throw new Error(
          '所有純前端通道皆無法讀取試算表，請確認：\n' +
          '1. 試算表共用權限已設為「知道連結的任何人 → 檢視者」\n' +
          '2. 試算表 ID 正確且網路連線正常\n' +
          '（詳細紀錄：' + errors.join(' | ') + '）'
        );
      },

      // 依資料重建字典（位置、分類、狀態）
      rebuildDict(items) {
        const locations = new Set();
        const categories = new Set();
        const statuses = new Set();

        items.forEach(i => {
          if (i.location) locations.add(i.location);
          if (i.category) categories.add(i.category);
          if (i.status) statuses.add(i.status);
        });

        const merge = (preferred, set) => {
          const result = preferred.filter(x => set.has(x));
          [...set].sort((a, b) => a.localeCompare(b, 'zh-Hant')).forEach(x => {
            if (!result.includes(x)) result.push(x);
          });
          return result;
        };

        AppState.dict.locations = merge(AppState.dict.locations, locations);
        AppState.dict.categories = merge(AppState.dict.categories, categories);
        AppState.dict.statuses = merge(AppState.dict.statuses, statuses);
      },

      async init(isManual = false) {
        if (this.isSyncing) return;
        this.isSyncing = true;
        this.setSyncStatus('loading', '同步中');

        // 第一次載入先顯示備援資料，避免畫面空白
        if (!isManual && AppState.items.length === 0) {
          AppState.items = Config.FALLBACK_ITEMS;
          UIController.renderAll();
        }

        try {
          const { items, transport } = await this.fetchFromSheet();
          AppState.items = items;
          AppState.meta.isLive = true;
          AppState.meta.transport = transport;
          AppState.meta.lastSyncedAt = new Date();

          this.rebuildDict(items);
          this.hideErrorBanner();
          this.setSyncStatus('live', `已同步 (${items.length}筆)`);
          const timeStr = AppState.meta.lastSyncedAt.toLocaleTimeString('zh-TW', { hour12: false });
          document.getElementById('syncStatusBtn').title = `已透過「${transport}」同步完成（${timeStr}，點擊重新同步）`;
          UIController.renderAll();
        } catch (err) {
          console.warn('讀取試算表失敗：', err.message);
          AppState.meta.isLive = false;
          if (AppState.items.length === 0) {
            AppState.items = Config.FALLBACK_ITEMS;
          }
          this.setSyncStatus('offline', '連線異常');
          this.showErrorBanner(err.message);
          document.getElementById('syncStatusBtn').title = '讀取失敗，點擊重試';
          UIController.renderAll();
        } finally {
          this.isSyncing = false;
        }
      }
    };

    /**
     * ============================================================================
     * UIController
     * ============================================================================
     */
    const UIController = {
      escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      getStatusBadge(status) {
        const st = status || '正常';
        const style = Config.STATUS_STYLES[st] || Config.STATUS_STYLES['正常'];
        const dotHtml = style.showDot
          ? `<span class="w-1.5 h-1.5 rounded-full ${style.dot}"></span>`
          : '';
        return `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border ${style.badge}">
            ${dotHtml}
            <span>${this.escapeHtml(st)}</span>
          </span>
        `;
      },

      getDictByType(type) {
        if (type === 'location') return AppState.dict.locations;
        if (type === 'category') return AppState.dict.categories;
        if (type === 'status') return AppState.dict.statuses;
        return [];
      },

      getFilterKey(type) {
        if (type === 'location') return 'locationFilter';
        if (type === 'category') return 'categoryFilter';
        if (type === 'status') return 'statusFilter';
        return '';
      },

      getSelectedSet(type) {
        const dict = this.getDictByType(type);
        const filterVal = AppState.ui[this.getFilterKey(type)];
        return filterVal === null ? new Set(dict) : filterVal;
      },

      getFilterSummaryText(type) {
        const dict = this.getDictByType(type);
        const filterVal = AppState.ui[this.getFilterKey(type)];
        if (filterVal === null || (dict.length > 0 && filterVal.size >= dict.length)) {
          return { text: '全部', isActive: false, isEmpty: false };
        }
        if (filterVal.size === 0) {
          return { text: '未選取', isActive: true, isEmpty: true };
        }
        if (filterVal.size === 1) {
          const onlyVal = [...filterVal][0];
          return { text: onlyVal, isActive: true, isEmpty: false };
        }
        // 只隱藏單一條件時，直接顯示「排除 XXX」方便辨識
        const excluded = dict.filter(opt => !filterVal.has(opt));
        if (excluded.length === 1 && dict.length >= 3) {
          return { text: `排除 ${excluded[0]}`, isActive: true, isEmpty: false };
        }
        return { text: `已選 ${filterVal.size}/${dict.length}`, isActive: true, isEmpty: false };
      },

      renderFilterSelects() {
        const types = ['location', 'category', 'status'];
        types.forEach(type => {
          const dict = this.getDictByType(type);
          const selectedSet = this.getSelectedSet(type);
          const btn = document.getElementById(`filterBtn_${type}`);
          const label = document.getElementById(`filterLabel_${type}`);
          const menu = document.getElementById(`filterMenu_${type}`);
          if (!btn || !label || !menu) return;

          const summary = this.getFilterSummaryText(type);
          label.textContent = summary.text;
          btn.title = summary.isActive
            ? `已啟用篩選（${selectedSet.size}/${dict.length} 項）`
            : '顯示全部條件（點擊可複選或排除）';

          // 依是否啟用篩選切換按鈕視覺提示
          const baseBtnClass = 'flex-1 min-w-0 inline-flex items-center justify-between gap-1 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-r-lg border focus:outline-none transition-colors cursor-pointer select-none';
          if (summary.isEmpty) {
            btn.className = `${baseBtnClass} bg-rose-50 hover:bg-rose-100/80 text-rose-700 border-rose-300`;
          } else if (summary.isActive) {
            btn.className = `${baseBtnClass} bg-slate-200/90 hover:bg-slate-300/70 text-slate-900 border-slate-400/90`;
          } else {
            btn.className = `${baseBtnClass} bg-slate-100/90 hover:bg-slate-200/70 text-slate-700 border-slate-300/90`;
          }

          const optionsHtml = dict.map((opt, idx) => {
            const isChecked = selectedSet.has(opt);
            const statusStyle = (type === 'status' && opt !== '正常' && Config.STATUS_STYLES[opt])
              ? Config.STATUS_STYLES[opt]
              : null;

            const rowClass = isChecked
              ? (statusStyle ? statusStyle.optionSelectedClass : 'bg-slate-800 text-white hover:bg-slate-700')
              : 'bg-white text-slate-800 hover:bg-slate-100';

            return `
              <div onclick="UIController.toggleFilterOption('${type}', ${idx})" role="option" aria-selected="${isChecked}"
                class="flex items-center px-3 py-2 transition-colors cursor-pointer select-none ${rowClass}">
                <span class="text-xs sm:text-sm truncate ${isChecked ? 'font-medium' : 'font-normal'}">${this.escapeHtml(opt)}</span>
              </div>
            `;
          }).join('');

          menu.innerHTML = `
            <div class="max-h-64 overflow-y-auto" role="listbox" aria-multiselectable="true">
              ${optionsHtml || '<div class="px-3 py-4 text-center text-xs text-slate-400">尚無可選項目</div>'}
            </div>
          `;
        });
      },

      toggleFilterDropdown(type, event) {
        if (event) event.stopPropagation();
        const isOpening = AppState.ui.openDropdown !== type;
        this.closeAllDropdowns();
        if (!isOpening) return;

        AppState.ui.openDropdown = type;
        const menu = document.getElementById(`filterMenu_${type}`);
        const btn = document.getElementById(`filterBtn_${type}`);
        const arrow = document.getElementById(`filterArrow_${type}`);
        if (!menu || !btn) return;

        // 重設水平對齊，開啟後檢查是否超出視窗右側邊界
        menu.classList.remove('hidden', 'right-0');
        menu.classList.add('left-0');
        btn.setAttribute('aria-expanded', 'true');
        if (arrow) arrow.classList.add('rotate-180');

        const rect = menu.getBoundingClientRect();
        if (rect.right > window.innerWidth - 12) {
          menu.classList.remove('left-0');
          menu.classList.add('right-0');
        }
      },

      closeAllDropdowns() {
        ['location', 'category', 'status'].forEach(type => {
          const menu = document.getElementById(`filterMenu_${type}`);
          const btn = document.getElementById(`filterBtn_${type}`);
          const arrow = document.getElementById(`filterArrow_${type}`);
          if (menu) menu.classList.add('hidden');
          if (btn) btn.setAttribute('aria-expanded', 'false');
          if (arrow) arrow.classList.remove('rotate-180');
        });
        AppState.ui.openDropdown = null;
      },

      toggleFilterOption(type, idx) {
        const dict = this.getDictByType(type);
        const value = dict[idx];
        if (value === undefined) return;

        const key = this.getFilterKey(type);
        const nextSet = new Set(this.getSelectedSet(type));
        if (nextSet.has(value)) nextSet.delete(value);
        else nextSet.add(value);

        AppState.ui[key] = (nextSet.size === dict.length) ? null : nextSet;
        this.renderFilterSelects();
        this.renderHierarchyList();
      },

      getFilteredItems() {
        const { locationFilter, categoryFilter, statusFilter } = AppState.ui;
        return AppState.items.filter(item => {
          const matchLoc = (locationFilter === null || locationFilter.has(item.location));
          const matchCat = (categoryFilter === null || categoryFilter.has(item.category));
          const matchSt  = (statusFilter === null || statusFilter.has(item.status));
          return matchLoc && matchCat && matchSt;
        });
      },

      renderHierarchyList() {
        const container = document.getElementById('hierarchyContainer');
        const emptyState = document.getElementById('emptyState');
        const filtered = this.getFilteredItems();

        if (filtered.length === 0) {
          container.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        const groups = {};
        filtered.forEach(item => {
          const key = item[AppState.ui.groupBy] || '其他';
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });

        let orderRef = [];
        if (AppState.ui.groupBy === 'location') orderRef = AppState.dict.locations;
        else if (AppState.ui.groupBy === 'category') orderRef = AppState.dict.categories;
        else if (AppState.ui.groupBy === 'status') orderRef = AppState.dict.statuses;

        const groupKeys = Object.keys(groups).sort((a, b) => {
          const idxA = orderRef.indexOf(a);
          const idxB = orderRef.indexOf(b);
          if (idxA === -1 && idxB === -1) return a.localeCompare(b, 'zh-Hant');
          if (idxA === -1) return 1;
          if (idxB === -1) return -1;
          return idxA - idxB;
        });

        container.innerHTML = groupKeys.map(groupName => {
          const groupItems = groups[groupName];
          const isCollapsed = AppState.ui.collapsedGroups.has(groupName);
          const damagedCount = groupItems.filter(i => i.status === '損壞').length;
          const safeGroupArg = groupName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

          const statusStyle = (AppState.ui.groupBy === 'status' && groupName !== '正常' && Config.STATUS_STYLES[groupName])
            ? Config.STATUS_STYLES[groupName]
            : null;
          const headerClass = statusStyle
            ? statusStyle.optionSelectedClass
            : 'bg-slate-800 text-white hover:bg-slate-700';

          const statsText = (AppState.ui.groupBy !== 'status' && damagedCount > 0)
            ? `${groupItems.length}項，<span class="text-rose-300 font-medium">${damagedCount}損壞</span>`
            : `${groupItems.length}項`;

          return `
            <section class="bg-white rounded-xl border border-slate-200/80 shadow-2xs overflow-hidden">
              <button type="button" onclick="UIController.toggleGroup('${safeGroupArg}')"
                class="w-full px-4 py-2.5 flex items-center justify-between transition-colors text-left select-none cursor-pointer ${headerClass}">
                <div class="flex items-center gap-2">
                  <span class="material-icons text-white/75 transition-transform duration-200 ${isCollapsed ? '-rotate-90' : 'rotate-0'}" style="font-size: 18px;">expand_more</span>
                  <span class="text-sm font-semibold text-white">${this.escapeHtml(groupName)}</span>
                  <span class="text-xs text-white/80 ml-0.5">${statsText}</span>
                </div>
              </button>
              <div class="${isCollapsed ? 'hidden' : 'p-3.5 border-t border-slate-100'}">
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5">
                  ${groupItems.map(item => this.renderMiniCard(item)).join('')}
                </div>
              </div>
            </section>
          `;
        }).join('');
      },

      renderMiniCard(item) {
        const iconHtml = item.iconHtml && item.iconHtml.includes('material-icons')
          ? item.iconHtml
          : '<span class="material-icons">devices</span>';
        const displayName = item.alias || item.item || '未命名';
        const style = Config.STATUS_STYLES[item.status] || Config.STATUS_STYLES['正常'];

        return `
          <button type="button" onclick="UIController.openDetailModal(${item.rowNumber})"
            class="group flex items-center gap-2 px-3 py-2.5 rounded-xl border text-left transition-all cursor-pointer select-none ${style.cardClass}">
            <span class="shrink-0 flex items-center justify-center transition-colors ${style.iconClass}">${iconHtml}</span>
            <span class="text-xs sm:text-sm font-medium truncate ${style.textClass}">${this.escapeHtml(displayName)}</span>
          </button>
        `;
      },

      openDetailModal(rowNumber) {
        const item = AppState.items.find(i => i.rowNumber === rowNumber);
        if (!item) return;

        const modal = document.getElementById('detailModal');
        const iconBox = document.getElementById('modalIconBox');
        const aliasEl = document.getElementById('modalAlias');
        const itemNameEl = document.getElementById('modalItemName');
        const bodyEl = document.getElementById('modalBody');

        iconBox.innerHTML = item.iconHtml && item.iconHtml.includes('material-icons')
          ? item.iconHtml
          : '<span class="material-icons">devices</span>';
        aliasEl.textContent = item.alias || item.item || '未命名';
        itemNameEl.textContent = item.item || '-';

        const noteText = (item.note || '').replace(/<br\s*\/?>/gi, ' / ');
        const isVideo = item.manualUrl && (item.manualUrl.includes('youtube.com') || item.manualUrl.includes('youtu.be'));

        bodyEl.innerHTML = `
          <div class="flex items-center justify-between py-1">
            <span class="text-slate-400">目前狀態</span>
            ${this.getStatusBadge(item.status)}
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100">
            <span class="text-slate-400">存放位置</span>
            <span class="font-medium text-slate-800">${this.escapeHtml(item.location)}</span>
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100">
            <span class="text-slate-400">設備分類</span>
            <span class="font-medium text-slate-800">${this.escapeHtml(item.category)}</span>
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100 gap-4">
            <span class="text-slate-400 shrink-0">廠牌型號</span>
            <span class="font-mono text-xs text-slate-800 text-right">${this.escapeHtml(item.model || '未登錄')}</span>
          </div>
          ${noteText ? `
            <div class="pt-2 border-t border-slate-100">
              <span class="text-slate-400 block mb-1">備註</span>
              <p class="text-slate-700 bg-slate-50 px-3 py-2 rounded-lg text-xs">${this.escapeHtml(noteText)}</p>
            </div>
          ` : ''}
          ${item.extraInfo ? `
            <div class="pt-2 border-t border-slate-100">
              <span class="text-slate-400 block mb-1">相關資料</span>
              <p class="text-slate-700 bg-slate-50 px-3 py-2 rounded-lg text-xs">${this.escapeHtml(item.extraInfo)}</p>
            </div>
          ` : ''}
          ${item.manualUrl ? `
            <div class="pt-3 border-t border-slate-100">
              <a href="${this.escapeHtml(item.manualUrl)}" target="_blank" rel="noopener noreferrer"
                class="w-full inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 text-xs font-medium transition-colors">
                <span class="material-icons" style="font-size: 16px;">${isVideo ? 'play_circle' : 'description'}</span>
                <span>${isVideo ? '觀看教學影片' : '查看操作說明書'}</span>
                <span class="material-icons" style="font-size: 14px;">open_in_new</span>
              </a>
            </div>
          ` : ''}
        `;

        modal.classList.remove('hidden');
      },

      closeDetailModal() {
        document.getElementById('detailModal').classList.add('hidden');
      },

      setGroupBy(field) {
        AppState.ui.groupBy = field;
        AppState.ui.collapsedGroups.clear();

        const btnMap = {
          location: document.getElementById('groupByLocationBtn'),
          category: document.getElementById('groupByCategoryBtn'),
          status: document.getElementById('groupByStatusBtn')
        };

        const activeClass = 'shrink-0 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-800 bg-slate-800 text-white transition-colors cursor-pointer select-none whitespace-nowrap';
        const inactiveClass = 'shrink-0 px-2 sm:px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-300/90 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors cursor-pointer select-none whitespace-nowrap';

        Object.keys(btnMap).forEach(key => {
          if (btnMap[key]) {
            btnMap[key].className = (key === field) ? activeClass : inactiveClass;
          }
        });

        this.renderHierarchyList();
      },

      toggleGroup(groupName) {
        if (AppState.ui.collapsedGroups.has(groupName)) {
          AppState.ui.collapsedGroups.delete(groupName);
        } else {
          AppState.ui.collapsedGroups.add(groupName);
        }
        this.renderHierarchyList();
      },

      resetFilters() {
        AppState.ui.locationFilter = null;
        AppState.ui.categoryFilter = null;
        AppState.ui.statusFilter = null;
        this.closeAllDropdowns();
        this.renderAll();
      },

      renderAll() {
        this.renderFilterSelects();
        this.renderHierarchyList();
      }
    };

    // Esc 關閉面板與下拉選單
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        UIController.closeDetailModal();
        UIController.closeAllDropdowns();
      }
    });

    // 點擊下拉選單外部自動收合
    document.addEventListener('click', (e) => {
      if (AppState.ui.openDropdown && !e.target.closest('[data-filter-dropdown]')) {
        UIController.closeAllDropdowns();
      }
    });

    // 頁面重新顯示時自動同步
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        DataService.init(false);
      }
    });

    // 啟動
    window.addEventListener('DOMContentLoaded', () => {
      DataService.init(false);
    });
  </script>
  <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    navigator.serviceWorker.register('./sw.js')
                        .then(r => console.log('SW註冊成功')).catch(e => console.error('SW註冊失敗', e));
                } else {
                    console.log('當前環境 (' + window.location.protocol + ') 暫不支援 Service Worker 註冊。');
                }
            });
        }
    </script>
</body>
</html>
