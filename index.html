<body class="min-h-screen antialiased selection:bg-slate-800 selection:text-white pb-16">

  <script>
    /**

          dot: 'bg-amber-500',
          showDot: true
        },
        '外借': {
          cardClass: 'bg-teal-600 border-teal-700 hover:bg-teal-700 shadow-2xs',
          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-teal-50 text-teal-700 border-teal-200',
          dot: 'bg-teal-500',
          showDot: true
        },
        '送修': {

          iconClass: 'text-white',
          textClass: 'text-white',
          badge: 'bg-orange-50 text-orange-700 border-orange-200',
          dot: 'bg-orange-500',
          showDot: true
        }
      },

      FALLBACK_ITEMS: [
        { rowNumber: 2, item: '投影機', category: '媒體', location: '四樓 歡喜地', status: '正常', note: '', alias: '投影機', iconHtml: '<span class="material-icons">videocam</span>', model: '', manualUrl: '', extraInfo: '' },
        { rowNumber: 3, item: '音響擴大器', category: '固定設備', location: '三樓 音控室', status: '正常', note: '', alias: '音響', iconHtml: '<span class="material-icons">speaker</span>', model: 'YAMAHA MA2120', manualUrl: 'https://tw.yamaha.com/zh/download/files/2097944/', extraInfo: '' },
        { rowNumber: 4, item: '麥克風接收天線', category: '固定設備', location: '四樓 歡喜地', status: '正常', note: '', alias: '接收器', iconHtml: '<span class="material-icons">settings_input_antenna</span>', model: 'MIPRO ACT 323', manualUrl: 'https://www.youtube.com/watch?v=7bTNLrbrvAE', extraInfo: '' },
        { rowNumber: 6, item: '無線麥克風', category: '音控', location: '一樓 齋堂', status: '正常', note: '#2', alias: '無線2 (5D)', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 33H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' },
        { rowNumber: 19, item: '無線麥克風', category: '音控', location: '三樓 音控室', status: '損壞', note: '#2-舊', alias: '無線2 (6C)', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 33H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' },
        { rowNumber: 20, item: '無線麥克風', category: '音控', location: '三樓 音控室', status: '儲備', note: '2025購入', alias: '無線麥', iconHtml: '<span class="material-icons">mic</span>', model: 'MIPRO ACT 32H', manualUrl: 'https://youtu.be/cOe7mJ5Ank8', extraInfo: '' }
      ]
    };

    /**
     * ============================================================================
     * AppState
     * ============================================================================
     */
    const AppState = {
      items: [],
      meta: {
        isLive: false,
        transport: '',
        lastSyncedAt: null
      },
      dict: {
        categories: ['音控', '媒體', '攝錄', '固定設備'],
        locations: ['四樓 歡喜地', '三樓 大殿', '三樓 音控室', '二樓 大教室', '二樓 小教室', '二樓 辦公室', '一樓 齋堂'],
        statuses: ['正常', '儲備', '暫代', '外借', '送修', '損壞']
      },
      ui: {
        locationFilter: 'ALL',
        categoryFilter: 'ALL',
        statusFilter: 'ALL',
        groupBy: 'location',
        collapsedGroups: new Set()
      }
    };

    /**
     * ============================================================================
     * DataService（純前端多通道讀取 Google Sheets，徹底避開 CORS 限制）
     * ----------------------------------------------------------------------------
     * 讀取策略（依序自動降級，完全不依賴 GAS 或第三方 Proxy）：
     *   1. JSONP (<script> 動態注入)：Google Visualization API 原生支援
     *      responseHandler 回呼，瀏覽器載入 <script> 不受 CORS Policy 限制，
     *      即使直接雙擊本機 HTML 檔 (file:// Origin: null) 也能順利讀取全資料。
     *   2. Fetch gviz/tq (CORS 模式)：備援方案，適用於 CSP 禁用動態外部腳本的環境。
     *   3. Fetch CSV Export：最終備援，透過標準 CSV 匯出端點與 RFC 4180 解析器讀取。
     * ============================================================================
     */
    const DataService = {
      _isFetching: false,

      normalizeText(val) {
        return String(val || '').replace(/\s+/g, ' ').trim();
      },

      setSyncStatus(state, message) {
        const dot = document.getElementById('syncDot');
        const label = document.getElementById('syncLabel');
        if (!dot || !label) return;

        if (state === 'loading') {
          dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
          label.textContent = message || '同步中';
        } else if (state === 'live') {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
          label.textContent = message || '已連線';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-rose-500';
          label.textContent = message || '連線異常';
        }
      },

      showErrorBanner(detailText) {
        const banner = document.getElementById('syncErrorBanner');
        const detail = document.getElementById('syncErrorDetail');
        if (!banner || !detail) return;
        detail.textContent = detailText;
        banner.classList.remove('hidden');
      },

      hideErrorBanner() {
        const banner = document.getElementById('syncErrorBanner');
        if (banner) banner.classList.add('hidden');
      },

      /**
       * 建立 gviz 查詢網址
       * @param {string|null} callbackName 若提供則啟用 JSONP responseHandler
       */
      buildGvizUrl(callbackName = null) {
        const tqx = callbackName
          ? `out:json;responseHandler:${callbackName}`
          : 'out:json';
        let url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(Config.SHEET_ID)}/gviz/tq?tqx=${tqx}&headers=1`;
        if (Config.SHEET_GID) url += `&gid=${encodeURIComponent(Config.SHEET_GID)}`;
        if (Config.SHEET_NAME) url += `&sheet=${encodeURIComponent(Config.SHEET_NAME)}`;
        url += `&_t=${Date.now()}`;
        return url;
      },

      /**
       * 建立 CSV 匯出網址（備援用）
       */
      buildCsvUrl() {
        let url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(Config.SHEET_ID)}/export?format=csv`;
        if (Config.SHEET_GID) url += `&gid=${encodeURIComponent(Config.SHEET_GID)}`;
        url += `&_t=${Date.now()}`;
        return url;
      },

      /**
       * 通道 1：純前端 JSONP 讀取（完全繞過瀏覽器 CORS Policy）
       */
      fetchViaJsonp() {
        return new Promise((resolve, reject) => {
          const cbName = `__gviz_cb_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            clearTimeout(timer);
            try {
              delete window[cbName];
            } catch (_) {
              window[cbName] = undefined;
            }
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }
          };

          const finish = (err, data) => {
            if (settled) return;
            settled = true;
            cleanup();
            if (err) reject(err);
            else resolve(data);
          };

          // 註冊全域回呼函式，讓 Google 回傳的腳本直接注入完整 JSON 物件
          window[cbName] = (responseObj) => {
            try {
              if (!responseObj || typeof responseObj !== 'object') {
                throw new Error('JSONP 回傳資料格式異常');
              }
              if (responseObj.status === 'error') {
                const msg = (responseObj.errors || [])
                  .map(e => e.detailed_message || e.message || e.reason)
                  .filter(Boolean)
                  .join('；');
                throw new Error(msg || 'Google Sheets 回傳錯誤（請確認權限已公開檢視）');
              }
              const items = this.parseGvizObject(responseObj);
              finish(null, items);
            } catch (parseErr) {
              finish(parseErr);
            }
          };

          script.async = true;
          script.src = this.buildGvizUrl(cbName);

          script.onerror = () => {
            finish(new Error('JSONP 腳本載入失敗（可能是網路中斷、試算表 ID 錯誤或權限未公開）'));
          };

          // 若腳本載入完畢但未觸發回呼，代表 Google 回傳了登入頁面 HTML 而非資料
          script.onload = () => {
            setTimeout(() => {
              if (!settled) {
                finish(new Error('試算表未回傳有效資料（請確認共用權限已設為「知道連結的任何人 → 檢視者」）'));
              }
            }, 50);
          };

          const timer = setTimeout(() => {
            finish(new Error(`JSONP 連線逾時（超過 ${Config.TIMEOUT_MS / 1000} 秒）`));
          }, Config.TIMEOUT_MS);

          document.head.appendChild(script);
        });
      },

      /**
       * 通道 2：標準 Fetch 讀取 gviz/tq
       */
      async fetchViaGvizCors() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);
        try {
          const url = this.buildGvizUrl(null);
          const res = await fetch(url, {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            signal: controller.signal
          });
          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }
          const text = await res.text();
          if (text.includes('Sign in') || text.includes('accounts.google.com')) {
            throw new Error('試算表需要登入權限，請改為「知道連結的任何人可檢視」');
          }
          const start = text.indexOf('{');
          const end = text.lastIndexOf('}') + 1;
          if (start === -1 || end === 0) {
            throw new Error('gviz 回傳內容不包含有效 JSON');
          }
          const json = JSON.parse(text.slice(start, end));
          return this.parseGvizObject(json);
        } finally {
          clearTimeout(timer);
        }
      },

      /**
       * 通道 3：標準 Fetch 讀取 CSV 匯出端點
       */
      async fetchViaCsvCors() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);
        try {
          const res = await fetch(this.buildCsvUrl(), {
            method: 'GET',
            mode: 'cors',
            credentials: 'omit',
            signal: controller.signal
          });
          if (!res.ok) {
            throw new Error(`CSV HTTP ${res.status}`);
          }
          const csvText = await res.text();
          if (csvText.includes('<!DOCTYPE html>') || csvText.includes('accounts.google.com')) {
            throw new Error('CSV 匯出端點需要登入權限');
          }
          const matrix = this.parseCsvText(csvText);
          if (matrix.length < 2) {
            throw new Error('CSV 沒有足夠的資料列');
          }
          return this.mapMatrixToItems(matrix[0], matrix.slice(1));
        } finally {
          clearTimeout(timer);
        }
      },

      /**
       * RFC 4180 CSV 解析器（支援引號、內嵌逗號與多行儲存格）
       */
      parseCsvText(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          const next = text[i + 1];

          if (inQuotes) {
            if (ch === '"' && next === '"') {
              field += '"';
              i++;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              field += ch;
            }
          } else {
            if (ch === '"') {
              inQuotes = true;
            } else if (ch === ',') {
              row.push(field);
              field = '';
            } else if (ch === '\r' && next === '\n') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
              i++;
            } else if (ch === '\n' || ch === '\r') {
              row.push(field);
              rows.push(row);
              row = [];
              field = '';
            } else {
              field += ch;
            }
          }
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        return rows;
      },

      /**
       * 從 gviz 儲存格提取乾淨字串（兼容 Date、公式與格式化顯示值）
       */
      extractGvizCellValue(cell) {
        if (!cell) return '';
        // 若 v 為 gviz Date(...) 字串，優先採用已格式化的 f
        if (typeof cell.v === 'string' && cell.v.startsWith('Date(') && cell.f) {
          return String(cell.f).trim();
        }
        if (cell.v != null && String(cell.v).trim() !== '') {
          return String(cell.v).trim();
        }
        if (cell.f != null && String(cell.f).trim() !== '') {
          return String(cell.f).trim();
        }
        return '';
      },

      /**
       * 解析 gviz 回傳物件為標準設備清單
       */
      parseGvizObject(json) {
        if (!json || !json.table || !Array.isArray(json.table.cols) || !Array.isArray(json.table.rows)) {
          throw new Error('試算表沒有資料或結構異常');
        }

        let headers = json.table.cols.map(c => this.normalizeText(c.label || ''));
        let rawRows = json.table.rows.map(r =>
          (r && Array.isArray(r.c)) ? r.c.map(cell => this.extractGvizCellValue(cell)) : []
        );

        // 若試算表標題列未被 gviz 自動辨識進 cols.label，則取第一列作為標題
        const hasAnyLabel = headers.some(h => h !== '');
        if (!hasAnyLabel && rawRows.length > 0) {
          headers = rawRows[0].map(h => this.normalizeText(h));
          rawRows = rawRows.slice(1);
        }

        return this.mapMatrixToItems(headers, rawRows);
      },

      /**
       * 將二維標題與資料列對應為統一的設備物件陣列
       */
      mapMatrixToItems(headers, dataRows) {
        const normalizedHeaders = headers.map(h => this.normalizeText(h).toLowerCase());

        // 欄位對應：優先完全相符，若無再進行模糊包含比對
        const findCol = (...names) => {
          for (const n of names) {
            const target = n.toLowerCase();
            const exactIdx = normalizedHeaders.findIndex(h => h === target);
            if (exactIdx !== -1) return exactIdx;
          }
          for (const n of names) {
            const target = n.toLowerCase();
            const partialIdx = normalizedHeaders.findIndex(h => h.includes(target));
            if (partialIdx !== -1) return partialIdx;
          }
          return -1;
        };

        const colMap = {
          item:      findCol('品項', 'item', '設備', '名稱', '品名'),
          category:  findCol('分類', 'category', '類別'),
          location:  findCol('位置', 'location', '存放位置', '地點'),
          status:    findCol('狀態', 'status'),
          note:      findCol('備註', 'note', '說明'),
          alias:     findCol('代稱', 'alias', '簡稱', '顯示名稱'),
          model:     findCol('型號', 'model', '廠牌型號', '機型'),
          manualUrl: findCol('說明書', 'manual', 'manualurl', '連結', '影片', '操作說明'),
          extraInfo: findCol('相關資料', 'extrainfo', 'extra', '補充'),
          icon:      findCol('圖標', 'icon', 'iconhtml', '圖示')
        };

        const items = [];
        dataRows.forEach((cells, idx) => {
          const get = (key) => {
            const colIdx = colMap[key];
            if (colIdx === -1 || colIdx >= cells.length) return '';
            return String(cells[colIdx] || '').trim();
          };

          const rawItem = get('item');
          const rawAlias = get('alias');
          const itemName = rawItem || rawAlias;
          if (!itemName) return; // 跳過完全空白列

          // 處理圖標：支援完整 HTML 標籤、純 Material Icon 名稱，或依品項自動推斷
          let iconHtml = get('icon');
          if (iconHtml && !iconHtml.includes('<') && /^[a-z0-9_]+$/i.test(iconHtml)) {
            iconHtml = `<span class="material-icons">${iconHtml}</span>`;
          }
          if (!iconHtml || !iconHtml.includes('material-icons')) {
            const lowerName = itemName.toLowerCase();
            if (lowerName.includes('投影') || lowerName.includes('projector')) {
              iconHtml = '<span class="material-icons">videocam</span>';
            } else if (lowerName.includes('音響') || lowerName.includes('擴大') || lowerName.includes('喇叭') || lowerName.includes('speaker')) {
              iconHtml = '<span class="material-icons">speaker</span>';
            } else if (lowerName.includes('麥克風') || lowerName.includes('mic')) {
              iconHtml = '<span class="material-icons">mic</span>';
            } else if (lowerName.includes('天線') || lowerName.includes('接收')) {
              iconHtml = '<span class="material-icons">settings_input_antenna</span>';
            } else if (lowerName.includes('相機') || lowerName.includes('攝影') || lowerName.includes('錄影')) {
              iconHtml = '<span class="material-icons">photo_camera</span>';
            } else if (lowerName.includes('螢幕') || lowerName.includes('電視') || lowerName.includes('顯示器')) {
              iconHtml = '<span class="material-icons">tv</span>';
            } else if (lowerName.includes('電腦') || lowerName.includes('筆電')) {
              iconHtml = '<span class="material-icons">laptop</span>';
            } else {
              iconHtml = '<span class="material-icons">devices</span>';
            }
          }

          items.push({
            rowNumber: idx + 2,
            item: itemName,
            category: this.normalizeText(get('category')) || '其他',
            location: this.normalizeText(get('location')) || '未指定位置',
            status: this.normalizeText(get('status')) || '正常',
            note: get('note'),
            alias: rawAlias || itemName,
            model: get('model'),
            manualUrl: get('manualUrl'),
            extraInfo: get('extraInfo'),
            iconHtml
          });
        });

        if (items.length === 0) {
          throw new Error('已連線至試算表，但未解析出任何有效設備列（請確認標題列是否包含「品項」欄位）');
        }

        return items;
      },

      /**
       * 依序嘗試純前端無 CORS 通道讀取全資料
       */
      async fetchFromSheet() {
        if (!Config.SHEET_ID || Config.SHEET_ID.includes('請在這裡')) {
          throw new Error('尚未設定試算表 ID（請在 Config.SHEET_ID 填入）');
        }

        const errors = [];
        const strategies = [
          { name: 'JSONP 直連 (無CORS限制)', fn: () => this.fetchViaJsonp() },
          { name: 'Fetch gviz', fn: () => this.fetchViaGvizCors() },
          { name: 'Fetch CSV 備援', fn: () => this.fetchViaCsvCors() }
        ];

        for (const strategy of strategies) {
          try {
            const items = await strategy.fn();
            return { items, transport: strategy.name };
          } catch (err) {
            console.warn(`[DataService] 通道「${strategy.name}」失敗：`, err.message);
            errors.push(`${strategy.name}：${err.message}`);
          }
        }

        throw new Error(errors.join('\n'));
      },

      /**
       * 依最新資料重建篩選字典（保留原本常用順序，並自動補入新分類）
       */
      rebuildDict(items) {
        const locations = new Set();
        const categories = new Set();
        const statuses = new Set();

        items.forEach(i => {
          if (i.location) locations.add(i.location);
          if (i.category) categories.add(i.category);
          if (i.status) statuses.add(i.status);
        });

        const merge = (preferred, set) => {
          const result = preferred.filter(x => set.has(x));
          [...set].sort((a, b) => a.localeCompare(b, 'zh-Hant')).forEach(x => {
            if (!result.includes(x)) result.push(x);
          });
          return result;
        };

        AppState.dict.locations = merge(AppState.dict.locations, locations);
        AppState.dict.categories = merge(AppState.dict.categories, categories);
        AppState.dict.statuses = merge(AppState.dict.statuses, statuses);
      },

      async init(isManual = false) {
        if (this._isFetching) return;
        this._isFetching = true;
        this.setSyncStatus('loading', '同步中');

        // 初次載入先呈現內建範例資料，避免畫面空白
        if (!isManual && AppState.items.length === 0) {
          AppState.items = Config.FALLBACK_ITEMS;
          UIController.renderAll();
        }

        try {
          const { items, transport } = await this.fetchFromSheet();
          AppState.items = items;
          AppState.meta.isLive = true;
          AppState.meta.transport = transport;
          AppState.meta.lastSyncedAt = new Date();

          this.rebuildDict(items);
          this.hideErrorBanner();
          this.setSyncStatus('live', `已同步 (${items.length}筆)`);

          const timeStr = AppState.meta.lastSyncedAt.toLocaleTimeString('zh-TW', { hour12: false });
          document.getElementById('syncStatusBtn').title =
            `同步成功｜通道：${transport}｜更新時間：${timeStr}（點擊重新同步）`;

          UIController.renderAll();
        } catch (err) {
          console.warn('所有通道皆無法讀取試算表：', err.message);
          if (AppState.items.length === 0) {
            AppState.items = Config.FALLBACK_ITEMS;
          }
          AppState.meta.isLive = false;
          this.setSyncStatus('offline', '連線異常');
          this.showErrorBanner(err.message);
          document.getElementById('syncStatusBtn').title = '讀取失敗（點擊重試）';
          UIController.renderAll();
        } finally {
          this._isFetching = false;
        }
      }
    };

    /**
     * ============================================================================
     * UIController（保持原有極簡 UI/UX）
     * ============================================================================
     */
    const UIController = {
      escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      getStatusBadge(status) {
        const st = status || '正常';
        const style = Config.STATUS_STYLES[st] || Config.STATUS_STYLES['正常'];
        const dotHtml = style.showDot
          ? `<span class="w-1.5 h-1.5 rounded-full ${style.dot}"></span>`
          : '';
        return `
          <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border ${style.badge}">
            ${dotHtml}
            <span>${this.escapeHtml(st)}</span>
          </span>
        `;
      },

      renderFilterSelects() {
        const locSelect = document.getElementById('locationFilterSelect');
        const catSelect = document.getElementById('categoryFilterSelect');
        const stSelect = document.getElementById('statusFilterSelect');

        locSelect.innerHTML = `<option value="ALL">全部</option>` +
          AppState.dict.locations.map(loc =>
            `<option value="${this.escapeHtml(loc)}" ${AppState.ui.locationFilter === loc ? 'selected' : ''}>${this.escapeHtml(loc)}</option>`
          ).join('');

        catSelect.innerHTML = `<option value="ALL">全部</option>` +
          AppState.dict.categories.map(cat =>
            `<option value="${this.escapeHtml(cat)}" ${AppState.ui.categoryFilter === cat ? 'selected' : ''}>${this.escapeHtml(cat)}</option>`
          ).join('');

        stSelect.innerHTML = `<option value="ALL">全部</option>` +
          AppState.dict.statuses.map(st =>
            `<option value="${this.escapeHtml(st)}" ${AppState.ui.statusFilter === st ? 'selected' : ''}>${this.escapeHtml(st)}</option>`
          ).join('');
      },

      getFilteredItems() {
        const { locationFilter, categoryFilter, statusFilter } = AppState.ui;
        return AppState.items.filter(item => {
          const matchLoc = (locationFilter === 'ALL' || item.location === locationFilter);
          const matchCat = (categoryFilter === 'ALL' || item.category === categoryFilter);
          const matchSt  = (statusFilter === 'ALL' || item.status === statusFilter);
          return matchLoc && matchCat && matchSt;
        });
      },

      renderHierarchyList() {
        const container = document.getElementById('hierarchyContainer');
        const emptyState = document.getElementById('emptyState');
        const filtered = this.getFilteredItems();

        if (filtered.length === 0) {
          container.innerHTML = '';
          emptyState.classList.remove('hidden');
          return;
        }

        emptyState.classList.add('hidden');

        const groups = {};
        filtered.forEach(item => {
          const key = item[AppState.ui.groupBy] || '其他';
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });

        let orderRef = [];
        if (AppState.ui.groupBy === 'location') orderRef = AppState.dict.locations;
        else if (AppState.ui.groupBy === 'category') orderRef = AppState.dict.categories;
        else if (AppState.ui.groupBy === 'status') orderRef = AppState.dict.statuses;

        const groupKeys = Object.keys(groups).sort((a, b) => {
          const idxA = orderRef.indexOf(a);
          const idxB = orderRef.indexOf(b);
          if (idxA === -1 && idxB === -1) return a.localeCompare(b, 'zh-Hant');
          if (idxA === -1) return 1;
          if (idxB === -1) return -1;
          return idxA - idxB;
        });

        container.innerHTML = groupKeys.map(groupName => {
          const groupItems = groups[groupName];
          const isCollapsed = AppState.ui.collapsedGroups.has(groupName);
          const damagedCount = groupItems.filter(i => i.status === '損壞').length;
          const safeGroupArg = groupName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

          const statsText = (AppState.ui.groupBy !== 'status' && damagedCount > 0)
            ? `${groupItems.length}項，<span class="text-rose-600 font-medium">${damagedCount}損壞</span>`
            : `${groupItems.length}項`;

          return `
            <section class="bg-white rounded-xl border border-slate-200/80 shadow-2xs overflow-hidden">
              <button type="button" onclick="UIController.toggleGroup('${safeGroupArg}')"
                class="w-full px-4 py-2.5 flex items-center justify-between bg-slate-50/70 hover:bg-slate-100/70 transition-colors text-left select-none cursor-pointer">
                <div class="flex items-center gap-2">
                  <span class="material-icons text-slate-400 transition-transform duration-200 ${isCollapsed ? '-rotate-90' : 'rotate-0'}" style="font-size: 18px;">expand_more</span>
                  <span class="text-sm font-semibold text-slate-800">${this.escapeHtml(groupName)}</span>
                  <span class="text-xs text-slate-500 ml-0.5">${statsText}</span>
                </div>
              </button>
              <div class="${isCollapsed ? 'hidden' : 'p-3.5 border-t border-slate-100'}">
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5">
                  ${groupItems.map(item => this.renderMiniCard(item)).join('')}
                </div>
              </div>
            </section>
          `;
        }).join('');
      },

      renderMiniCard(item) {
        const iconHtml = item.iconHtml && item.iconHtml.includes('material-icons')
          ? item.iconHtml
          : '<span class="material-icons">devices</span>';
        const displayName = item.alias || item.item || '未命名';
        const style = Config.STATUS_STYLES[item.status] || Config.STATUS_STYLES['正常'];

        return `
          <button type="button" onclick="UIController.openDetailModal(${item.rowNumber})"
            class="group flex items-center gap-2 px-3 py-2.5 rounded-xl border text-left transition-all cursor-pointer select-none ${style.cardClass}">
            <span class="shrink-0 flex items-center justify-center transition-colors ${style.iconClass}">${iconHtml}</span>
            <span class="text-xs sm:text-sm font-medium truncate ${style.textClass}">${this.escapeHtml(displayName)}</span>
          </button>
        `;
      },

      openDetailModal(rowNumber) {
        const item = AppState.items.find(i => i.rowNumber === rowNumber);
        if (!item) return;

        const modal = document.getElementById('detailModal');
        const iconBox = document.getElementById('modalIconBox');
        const aliasEl = document.getElementById('modalAlias');
        const itemNameEl = document.getElementById('modalItemName');
        const bodyEl = document.getElementById('modalBody');

        iconBox.innerHTML = item.iconHtml && item.iconHtml.includes('material-icons')
          ? item.iconHtml
          : '<span class="material-icons">devices</span>';
        aliasEl.textContent = item.alias || item.item || '未命名';
        itemNameEl.textContent = item.item || '-';

        const noteText = (item.note || '').replace(/<br\s*\/?>/gi, ' / ');
        const isVideo = item.manualUrl && (item.manualUrl.includes('youtube.com') || item.manualUrl.includes('youtu.be'));

        bodyEl.innerHTML = `
          <div class="flex items-center justify-between py-1">
            <span class="text-slate-400">目前狀態</span>
            ${this.getStatusBadge(item.status)}
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100">
            <span class="text-slate-400">存放位置</span>
            <span class="font-medium text-slate-800">${this.escapeHtml(item.location)}</span>
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100">
            <span class="text-slate-400">設備分類</span>
            <span class="font-medium text-slate-800">${this.escapeHtml(item.category)}</span>
          </div>
          <div class="flex items-center justify-between py-1 border-t border-slate-100 gap-4">
            <span class="text-slate-400 shrink-0">廠牌型號</span>
            <span class="font-mono text-xs text-slate-800 text-right">${this.escapeHtml(item.model || '未登錄')}</span>
          </div>
          ${noteText ? `
            <div class="pt-2 border-t border-slate-100">
              <span class="text-slate-400 block mb-1">備註</span>
              <p class="text-slate-700 bg-slate-50 px-3 py-2 rounded-lg text-xs">${this.escapeHtml(noteText)}</p>
            </div>
          ` : ''}
          ${item.extraInfo ? `
            <div class="pt-2 border-t border-slate-100">
              <span class="text-slate-400 block mb-1">相關資料</span>
              <p class="text-slate-700 bg-slate-50 px-3 py-2 rounded-lg text-xs">${this.escapeHtml(item.extraInfo)}</p>
            </div>
          ` : ''}
          ${item.manualUrl ? `
            <div class="pt-3 border-t border-slate-100">
              <a href="${this.escapeHtml(item.manualUrl)}" target="_blank" rel="noopener noreferrer"
                class="w-full inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800 text-xs font-medium transition-colors">
                <span class="material-icons" style="font-size: 16px;">${isVideo ? 'play_circle' : 'description'}</span>
                <span>${isVideo ? '觀看教學影片' : '查看操作說明書'}</span>
                <span class="material-icons" style="font-size: 14px;">open_in_new</span>
              </a>
            </div>
          ` : ''}
        `;

        modal.classList.remove('hidden');
      },

      closeDetailModal() {
        document.getElementById('detailModal').classList.add('hidden');
      },

      onFilterChange(type, value) {
        if (type === 'location') AppState.ui.locationFilter = value;
        if (type === 'category') AppState.ui.categoryFilter = value;
        if (type === 'status') AppState.ui.statusFilter = value;
        this.renderHierarchyList();
      },

      setGroupBy(field) {
        AppState.ui.groupBy = field;
        AppState.ui.collapsedGroups.clear();

        const btnMap = {
          location: document.getElementById('groupByLocationBtn'),
          category: document.getElementById('groupByCategoryBtn'),
          status: document.getElementById('groupByStatusBtn')
        };

        const activeClass = 'px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-800 bg-slate-800 text-white transition-colors cursor-pointer select-none whitespace-nowrap';
        const inactiveClass = 'px-2.5 py-1.5 text-xs sm:text-sm font-medium rounded-l-lg border border-r-0 border-slate-300/90 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-colors cursor-pointer select-none whitespace-nowrap';

        Object.keys(btnMap).forEach(key => {
          if (btnMap[key]) {
            btnMap[key].className = (key === field) ? activeClass : inactiveClass;
          }
        });

        this.renderHierarchyList();
      },

      toggleGroup(groupName) {
        if (AppState.ui.collapsedGroups.has(groupName)) {
          AppState.ui.collapsedGroups.delete(groupName);
        } else {
          AppState.ui.collapsedGroups.add(groupName);
        }
        this.renderHierarchyList();
      },

      resetFilters() {
        AppState.ui.locationFilter = 'ALL';
        AppState.ui.categoryFilter = 'ALL';
        AppState.ui.statusFilter = 'ALL';
        this.renderAll();
      },

      renderAll() {
        this.renderFilterSelects();
        this.renderHierarchyList();
      }
    };

    // Esc 關閉面板
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') UIController.closeDetailModal();
    });

    // 頁面重新顯示時自動同步
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        DataService.init(false);
      }
    });

    // 啟動
    window.addEventListener('DOMContentLoaded', () => {
      DataService.init(false);
    });
  </script>
</body>
</html>
